server:
  servlet:
    context-path: /RMBTControlServer
  port: ${CONTROL_SERVER_PORT:8080}
javamelody:
  init-parameters:
    # Disable GC / heap-dump / clear-counter actions in the monitoring report.
    system-actions-enabled: false
cleanup-task:
  # Spring cron (sec min hour day month weekday); daily at 04:00. Set to "-" to disable.
  cron: "0 0 4 * * *"
  # Empty = server's default time zone (e.g. set "Europe/Vienna" if the JVM runs in UTC).
  zone: ""
  # SQL statements executed, in order, on each run. This default is a harmless dummy (it just
  # returns the DB version); a deployment via context.xml may override this, e.g.
  # cleanup-task.statements[0] = "SELECT version()".
  statements:
    - "select version()"
test-server-quality:
  # Spring cron (sec min hour day month weekday); every 5 minutes. Set to "-" to disable the check.
  cron: "0 */5 * * * *"
  # Empty = server's default time zone (e.g. set "Europe/Vienna" if the JVM runs in UTC).
  zone: ""
  # This control server's own public IPv4/IPv6 are read from the "public_ipv4"/"public_ipv6" settings
  # (settings table). When set, ping tokens are signed with the correct source IP (UDP requires an
  # RR01 reply; RMBThttp gets the v2 token new servers need). When unset, UDP uses a placeholder and
  # accepts RE01, and RMBThttp sends a v1-only token.
icloud-egress:
  # Scheduled download of Apple's iCloud Private Relay egress IP ranges into Redis; the /ip endpoint
  # uses it to flag proxied clients. Set enabled=false to disable the download entirely.
  enabled: ${ICLOUD_EGRESS_ENABLED:true}
  url: ${ICLOUD_EGRESS_URL:https://mask-api.icloud.com/egress-ip-ranges.csv}
  # ISO-8601 durations. First run 20 s after start-up, then every 24 h.
  initial-delay: PT20S
  fixed-delay: PT24H
spring:
  # Default profile - used when spring.profiles.active is not set
  main:
    allow-bean-definition-overriding: true
  application:
    name: rtr-control-backend
  data:
    redis:
      host: ${CONTROL_REDIS_HOST:127.0.0.1}
      port: ${CONTROL_REDIS_PORT:6379}
      # Uncomment / set via env when the Redis instance requires auth:
      # password: ${CONTROL_REDIS_PASSWORD:}
  datasource:
    poolSize: 20
    minIdle: 1
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${CONTROL_DB_HOST:127.0.0.1}:${CONTROL_DB_PORT:5432}/${CONTROL_DB_NAME:rmbt}
    username: ${CONTROL_DB_USER:rmbt_control}
    # intellig: set pw in environment, e.g. STATISTIC_DB_PASSWORD=pwwithoutquotes
    password: ${CONTROL_DB_PASSWORD}
#    tomcat:
#      test-while-idle: true
#      test-on-borrow: true
#      validation-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  # Configuration for the Jackson 2 ObjectMapper used by the REST API. Spring Boot 4 binds the Jackson 2
  # compat mapper to the 'spring.jackson2.*' prefix ('spring.jackson.*' configures the Jackson 3 mapper,
  # which this app does not use for HTTP). The Jackson 2 converter is installed explicitly in
  # WebMvcConfiguration, because @EnableWebMvc disables Boot's message-converter auto-configuration
  # (so 'spring.http.converters.preferred-json-mapper' has no effect and Spring MVC would otherwise use
  # the Framework 7 default, Jackson 3). Jackson 2 is required for the custom Modules (JtsModule for
  # PostGIS geometry, lenient-UUID in JacksonConfig) and the epoch-timestamp date contract.
  jackson2:
    # Omit null fields from responses (e.g. url_alternative_ipv4_check when the setting is unset).
    default-property-inclusion: non_null
    serialization:
      # Preserve the long-standing REST contract of EPOCH timestamps for java.time values; Spring Boot
      # otherwise serializes them as ISO-8601 strings. Matches the mapper the API has always used.
      write-dates-as-timestamps: true
# used in src/main/java/at/rtr/rmbt/service/impl/QosMeasurementServiceImpl.java
RMBT_SECRETKEY: RMBT_SECRETKEY

auth0:
  issuer: https://auth.a2332751-f1b8-4d26-8291.example.com
  apiAudience: https://example.com
origin: ${CONTROL_ALLOWED_ORIGIN:*}
app:
  settings:
    # reload interval of the settings table cache (SettingsCache), ISO_8601
    refreshRate: PT10M
  rmbt:
    accuracyDetailLimit: 10000
    accuracyButtonLimit: 2000
    version: 0.1.0 || 0.3.0 || ^1.0.0
    language:
      supportedLanguages:
        - de
        - en
        - hr
        - sv
        - pl
        - es
        - is
        - fr
        - nb
        - cs
      defaultLanguage: en
    clientNames:
      - RMBT
      - RMBTjs
      - Open-RMBT
      - RMBTws
      - HW-PROBE
      - RTR-Netztest
      - RMBTel
application-version:
  host: rtr-control-default
  server-url: ${CONTROL_SERVER_URL:http://127.0.0.1:8080/RMBTControlServer}

client-tenant:
  clientTenantMapping:
    rtr: rtr
  defaultTenant: rtr

# springdoc / Swagger UI. Serve the OpenAPI spec at /api-docs(.yaml) instead of the springdoc
# default /v3/api-docs. Rationale: this Tomcat shares catalina.properties (JVM-global system
# properties) across webapps, and the statistics backend sets springdoc.swagger-ui.url=/api-docs.yaml
# there, which leaks into this control server (a JVM system property outranks this file, so we
# cannot override swagger-ui.url back — but api-docs.path is NOT injected, so we can move the spec
# to match). Swagger UI then resolves the spec via swagger-config regardless of environment.
springdoc:
  api-docs:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    poolSize: 20
    minIdle: 1
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${CONTROL_DB_HOST:127.0.0.1}:${CONTROL_DB_PORT:5432}/${CONTROL_DB_NAME:rmbt}
    username: ${CONTROL_DB_USER:rmbt_control}
    password: ${CONTROL_DB_PASSWORD}
#    tomcat:
#      test-while-idle: true
#      test-on-borrow: true
#      validation-query: SELECT 1

client-tenant:
  clientTenantMapping:
    rtr: rtr_dev
  defaultTenant: rtr

application-version:
  host: rtr-control-dev
  server-url: ${CONTROL_SERVER_URL:http://127.0.0.1:8080/RMBTControlServer}

---
spring:
  config:
    activate:
      # production profile - activate by adding "spring.profiles.active=prod" to "catalina.properties"
      on-profile: prod

  datasource:
    poolSize: 20
    minIdle: 1
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${CONTROL_DB_HOST:127.0.0.1}:${CONTROL_DB_PORT:5432}/${CONTROL_DB_NAME:rmbt}
    username: ${CONTROL_DB_USER:rmbt_control}
    password: ${CONTROL_DB_PASSWORD}
#    tomcat:
#      test-while-idle: true
#      test-on-borrow: true
#      validation-query: SELECT 1

application-version:
  host: ${HOST_ID:rtr-control-prod}
  server-url: ${CONTROL_SERVER_URL:http://127.0.0.1:8080/RMBTControlServer}

logging:
    config: ${LOGGING_CONFIG_FILE:classpath:logback.xml}
origin: ${CONTROL_ALLOWED_ORIGIN:https://www.netztest.at}

server:
  address: 0.0.0.0
  port: ${CONTROL_SERVER_PORT:8080}  # Optional: specify the port if different from the default 8080
